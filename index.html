<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>封面工坊 · COVER FORGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@600;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d11;
    --panel:#15151b;
    --panel-2:#1b1b23;
    --line:#2a2a35;
    --ink:#e8e6df;
    --ink-dim:#8b8b96;
    --amber:#ffb020;
    --amber-deep:#c9820a;
    --good:#3ecf8e;
    --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans SC',sans-serif;
    overflow:hidden;
    background-image:
      radial-gradient(ellipse 80% 60% at 70% -10%, rgba(255,176,32,.06), transparent),
      repeating-linear-gradient(0deg, transparent 0 31px, rgba(255,255,255,.018) 31px 32px),
      repeating-linear-gradient(90deg, transparent 0 31px, rgba(255,255,255,.018) 31px 32px);
  }
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

  /* ===== 顶栏：场记板风格 ===== */
  header{
    height:58px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;
    padding:0 22px;
    background:linear-gradient(180deg,#181820,#131318);
  }
  .slate{
    width:34px;height:34px;border:2px solid var(--amber);
    border-radius:6px;position:relative;flex-shrink:0;
    background:repeating-linear-gradient(135deg,var(--amber) 0 5px,transparent 5px 11px);
  }
  .slate::after{content:'';position:absolute;inset:5px;background:#101014;border-radius:2px}
  .brand{font-family:var(--mono);font-weight:700;letter-spacing:.14em;font-size:15px}
  .brand em{color:var(--amber);font-style:normal}
  .brand-sub{font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.3em;margin-top:2px}
  header .spacer{flex:1}
  .rec{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
  .rec i{width:9px;height:9px;border-radius:50%;background:#e5484d;animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  main{display:flex;height:calc(100% - 58px)}

  /* ===== 左侧控制台 ===== */
  aside{
    width:348px;flex-shrink:0;
    border-right:1px solid var(--line);
    background:var(--panel);
    overflow-y:auto;
    padding:20px 20px 40px;
  }
  .sec{margin-bottom:26px}
  .sec-title{
    font-family:var(--mono);font-size:10px;font-weight:700;
    color:var(--amber);letter-spacing:.28em;
    display:flex;align-items:center;gap:10px;margin-bottom:12px;
  }
  .sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  /* 上传区 */
  .drop{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:26px 14px;
    text-align:center;cursor:pointer;
    transition:.2s;
    position:relative;
  }
  .drop:hover,.drop.hover{border-color:var(--amber);background:rgba(255,176,32,.05)}
  .drop.has{border-style:solid;border-color:#3a3a46;padding:0;overflow:hidden;height:150px}
  .drop.has canvas{width:100%;height:100%;object-fit:cover;display:block}
  .drop .ic{font-size:26px;margin-bottom:8px}
  .drop p{font-size:13px;color:var(--ink)}
  .drop small{display:block;font-size:11px;color:var(--ink-dim);margin-top:4px;font-family:var(--mono)}
  .sample-btn{
    margin-top:10px;width:100%;
    background:none;border:1px solid var(--line);color:var(--ink-dim);
    font-family:var(--mono);font-size:11px;letter-spacing:.15em;
    padding:7px;border-radius:6px;cursor:pointer;transition:.15s;
  }
  .sample-btn:hover{border-color:var(--amber);color:var(--amber)}

  /* 输入 */
  .field{margin-bottom:12px}
  .field label{
    display:block;font-family:var(--mono);font-size:10px;
    color:var(--ink-dim);letter-spacing:.2em;margin-bottom:6px;
  }
  .field input[type=text]{
    width:100%;background:var(--panel-2);
    border:1px solid var(--line);border-radius:7px;
    color:var(--ink);font-size:14px;padding:10px 12px;
    font-family:'Noto Sans SC',sans-serif;
    transition:.15s;
  }
  .field input[type=text]:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,176,32,.12)}
  .count{font-family:var(--mono);font-size:10px;color:var(--ink-dim);text-align:right;margin-top:3px}

  /* 样式模板卡 */
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .preset{
    border:1px solid var(--line);border-radius:9px;
    padding:12px 10px;cursor:pointer;transition:.15s;
    background:var(--panel-2);position:relative;
  }
  .preset:hover{border-color:#4a4a58}
  .preset.on{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,176,32,.13)}
  .preset .demo{
    height:44px;border-radius:5px;margin-bottom:8px;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;white-space:nowrap;overflow:hidden;
    background:linear-gradient(135deg,#2d3038,#171a20);
  }
  .preset .pname{font-size:12px;font-weight:700}
  .preset .pdesc{font-size:10px;color:var(--ink-dim);margin-top:2px}
  .preset .lock{
    position:absolute;top:8px;right:8px;font-family:var(--mono);
    font-size:9px;color:var(--amber);opacity:0;transition:.15s;
  }
  .preset.on .lock{opacity:1}

  /* 滑杆 */
  .slider-row{display:flex;align-items:center;gap:12px}
  .slider-row input[type=range]{
    flex:1;-webkit-appearance:none;height:3px;background:var(--line);border-radius:2px;cursor:pointer;
  }
  .slider-row input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--amber);border:3px solid #0d0d11;box-shadow:0 0 0 1px var(--amber);
  }
  .slider-val{font-family:var(--mono);font-size:11px;color:var(--ink-dim);width:38px;text-align:right}

  /* 复选 */
  .check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-dim);cursor:pointer;user-select:none}
  .check input{accent-color:var(--amber);width:14px;height:14px}

  /* ===== 右侧舞台 ===== */
  .stage{
    flex:1;display:flex;flex-direction:column;
    min-width:0;
  }
  .ratio-bar{
    display:flex;align-items:center;gap:8px;
    padding:14px 24px;border-bottom:1px solid var(--line);
    background:rgba(21,21,27,.6);backdrop-filter:blur(6px);
  }
  .rtab{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    padding:7px 14px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);color:var(--ink-dim);
    display:flex;align-items:center;gap:8px;transition:.15s;
  }
  .rtab:hover{color:var(--ink)}
  .rtab.on{background:var(--amber);border-color:var(--amber);color:#141414;font-weight:700}
  .rtab .dim{
    display:inline-block;background:currentColor;border-radius:1.5px;
  }
  .ratio-bar .spacer{flex:1}

  .btn{
    font-family:var(--mono);font-size:12px;letter-spacing:.1em;
    padding:9px 18px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    transition:.15s;
  }
  .btn:hover{border-color:#4a4a58}
  .btn.primary{
    background:var(--amber);border-color:var(--amber);color:#141414;font-weight:700;
  }
  .btn.primary:hover{background:#ffc14a}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .canvas-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:30px;min-height:0;position:relative;overflow:hidden;
  }
  #preview{
    max-width:100%;max-height:100%;
    border-radius:6px;
    box-shadow:0 24px 80px rgba(0,0,0,.6), 0 0 0 1px var(--line);
    cursor:grab;touch-action:none;
  }
  #preview.grabbing{cursor:grabbing}
  .stage-hint{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:10px;color:var(--ink-dim);
    letter-spacing:.15em;background:rgba(13,13,17,.7);
    padding:6px 14px;border-radius:20px;border:1px solid var(--line);
    pointer-events:none;
  }

  /* toast */
  #toast{
    position:fixed;bottom:28px;right:28px;z-index:99;
    display:flex;flex-direction:column;gap:8px;
  }
  .toast-item{
    background:#1d1d26;border:1px solid var(--line);border-left:3px solid var(--good);
    padding:11px 18px;border-radius:8px;font-size:13px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    animation:tin .25s ease;
    font-family:var(--mono);font-size:12px;
  }
  @keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

  /* 字体演示样式（仅模板卡片） */
  .f-zcool{font-family:'ZCOOL QingKe HuangYou'}
  .f-mashan{font-family:'Ma Shan Zheng'}
  .f-serif{font-family:'Noto Serif SC';font-weight:900}
  .f-black{font-family:'Noto Sans SC';font-weight:900}

  @media (max-width:900px){
    body{overflow:auto}
    main{flex-direction:column;height:auto}
    aside{width:100%;border-right:none;border-bottom:1px solid var(--line)}
    .canvas-wrap{min-height:420px}
  }
</style>
</head>
<body>

<header>
  <div class="slate"></div>
  <div>
    <div class="brand">COVER <em>FORGE</em></div>
    <div class="brand-sub">封面工坊 · 风格统一出图台</div>
  </div>
  <div class="spacer"></div>
  <div class="rec"><i></i>STANDBY</div>
</header>

<main>
  <aside>
    <!-- 01 底图 -->
    <div class="sec">
      <div class="sec-title">01 · 底图 BASE</div>
      <div class="drop" id="drop">
        <div class="ic">🖼</div>
        <p>拖入底图，或点击选择</p>
        <small>JPG / PNG / WEBP</small>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <button class="sample-btn" id="btnSample">◈ 使用示例底图试试</button>
    </div>

    <!-- 02 文案 -->
    <div class="sec">
      <div class="sec-title">02 · 文案 TEXT</div>
      <div class="field">
        <label>主标题 MAIN TITLE</label>
        <input type="text" id="title" maxlength="24" placeholder="例：凌晨四点的菜市场">
        <div class="count"><span id="titleCount">0</span>/24</div>
      </div>
      <div class="field">
        <label>副标题 / 期数 SUBTITLE</label>
        <input type="text" id="subtitle" maxlength="30" placeholder="例：VOL.07 · 城市夜行记">
      </div>
    </div>

    <!-- 03 模板 -->
    <div class="sec">
      <div class="sec-title">03 · 风格模板 STYLE（锁定样式）</div>
      <div class="presets" id="presets"></div>
    </div>

    <!-- 04 构图 -->
    <div class="sec">
      <div class="sec-title">04 · 构图 FRAME</div>
      <div class="field">
        <div class="slider-row">
          <label style="margin:0;font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.15em">缩放</label>
          <input type="range" id="zoom" min="1" max="1.8" step="0.01" value="1">
          <span class="slider-val" id="zoomVal">1.00×</span>
        </div>
      </div>
      <div class="field">
        <div class="slider-row">
          <label style="margin:0;font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.15em">压暗</label>
          <input type="range" id="dim" min="0" max="0.7" step="0.01" value="0">
          <span class="slider-val" id="dimVal">0%</span>
        </div>
      </div>
      <label class="check"><input type="checkbox" id="guides"> 显示安全区参考线（仅预览，不导出）</label>
      <p style="font-size:11px;color:var(--ink-dim);margin-top:10px;line-height:1.6">
        提示：在预览画布上<b style="color:var(--ink)">拖动</b>可调整底图裁切位置——每个尺寸会自动按比例记忆。
      </p>
    </div>
  </aside>

  <section class="stage">
    <div class="ratio-bar">
      <div id="rtabs"></div>
      <div class="spacer"></div>
      <button class="btn" id="btnOne" disabled>导出当前尺寸 PNG</button>
      <button class="btn primary" id="btnAll" disabled>⬇ 导出全部尺寸</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="preview"></canvas>
      <div class="stage-hint" id="hint">DRAG TO REPOSITION · 拖动调整构图</div>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
/* ================= 数据定义 ================= */

const RATIOS = [
  {key:'16-9', label:'横屏 16:9', sub:'B站/西瓜', w:1280, h:720},
  {key:'9-16', label:'竖屏 9:16', sub:'抖音/视频号', w:1080, h:1920},
  {key:'1-1',  label:'方形 1:1',  sub:'小红书', w:1080, h:1080},
  {key:'3-4',  label:'竖屏 3:4',  sub:'公众号', w:1080, h:1440},
];

const PRESETS = [
  {
    name:'综艺高亮', desc:'白字黑边·粗黑体',
    demo:'<span class="f-black" style="color:#fff;-webkit-text-stroke:1.5px #101014;text-shadow:2px 2px 0 rgba(0,0,0,.4)">综艺高亮</span>',
    font:'"Noto Sans SC"', weight:900,
    color:'#FFFFFF', stroke:'#101014', strokeRatio:0.115,
    shadow:{color:'rgba(0,0,0,.5)', blur:0.06, offY:0.035, offX:0.02},
    size:0.088, pos:'bl', maxLines:3,
    accent:'#FFB020', accentStyle:'bar',
    subColor:'#FFD77E', subBg:'#101014',
    overlay:'bottom',
  },
  {
    name:'黑金质感', desc:'金字·方黑体·居中',
    demo:'<span class="f-zcool" style="color:#F6C453;text-shadow:0 2px 8px rgba(0,0,0,.8)">黑金质感</span>',
    font:'"ZCOOL QingKe HuangYou"', weight:400,
    color:'#F6C453', stroke:'#161006', strokeRatio:0.075,
    shadow:{color:'rgba(0,0,0,.75)', blur:0.09, offY:0.02, offX:0},
    size:0.10, pos:'bc', maxLines:2,
    accent:'#F6C453', accentStyle:'sides',
    subColor:'#EDE6D8', subBg:null,
    overlay:'v',
  },
  {
    name:'手写随笔', desc:'手写体·柔和阴影',
    demo:'<span class="f-mashan" style="color:#FFF6E8;text-shadow:0 3px 12px rgba(0,0,0,.6)">手写随笔</span>',
    font:'"Ma Shan Zheng"', weight:400,
    color:'#FFF6E8', stroke:null, strokeRatio:0,
    shadow:{color:'rgba(0,0,0,.55)', blur:0.10, offY:0.03, offX:0},
    size:0.115, pos:'bl', maxLines:3,
    accent:'#FF9D5C', accentStyle:'underline',
    subColor:'#F3EBDD', subBg:'rgba(16,16,20,.72)',
    overlay:'bottom',
  },
  {
    name:'杂志衬线', desc:'细衬线·极简留白',
    demo:'<span class="f-serif" style="color:#fff">杂志衬线</span>',
    font:'"Noto Serif SC"', weight:900,
    color:'#FFFFFF', stroke:null, strokeRatio:0,
    shadow:{color:'rgba(0,0,0,.45)', blur:0.08, offY:0.02, offX:0},
    size:0.072, pos:'bl', maxLines:3,
    accent:'#FFFFFF', accentStyle:'rule',
    subColor:'rgba(255,255,255,.82)', subBg:null,
    overlay:'bottom',
  },
];

/* ================= 状态 ================= */
const state = {
  img:null,          // HTMLImageElement
  title:'',
  subtitle:'',
  preset:0,
  ratio:0,
  zoom:1,
  dim:0,
  guides:false,
  pan:{},            // ratioKey -> {x,y} 归一化 -1..1
};

const $ = id => document.getElementById(id);
const preview = $('preview');
const ctx = preview.getContext('2d');

/* ================= 模板卡片 ================= */
const presetsBox = $('presets');
PRESETS.forEach((p,i)=>{
  const el = document.createElement('div');
  el.className = 'preset' + (i===state.preset?' on':'');
  el.innerHTML = `
    <div class="demo">${p.demo}</div>
    <div class="pname">${p.name}</div>
    <div class="pdesc">${p.desc}</div>
    <div class="lock">◆ LOCKED</div>`;
  el.onclick = ()=>{
    state.preset = i;
    presetsBox.querySelectorAll('.preset').forEach((n,j)=>n.classList.toggle('on', j===i));
    render();
  };
  presetsBox.appendChild(el);
});

/* ================= 尺寸 Tab ================= */
const rtabs = $('rtabs');
RATIOS.forEach((r,i)=>{
  const el = document.createElement('div');
  el.className = 'rtab' + (i===state.ratio?' on':'');
  const dim = r.w>=r.h ? [16,9] : (r.w===r.h?[11,11]:(r.key==='9-16'?[6,11]:[8,11]));
  el.innerHTML = `<span class="dim" style="width:${dim[0]}px;height:${dim[1]}px"></span>${r.label} <span style="opacity:.6;font-size:9px">${r.sub}</span>`;
  el.onclick = ()=>{
    state.ratio = i;
    rtabs.querySelectorAll('.rtab').forEach((n,j)=>n.classList.toggle('on', j===i));
    render();
  };
  rtabs.appendChild(el);
});

/* ================= 上传 ================= */
const drop = $('drop');
drop.onclick = ()=> $('file').click();
$('file').onchange = e => loadFile(e.target.files[0]);
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hover')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hover')}));
drop.addEventListener('drop', e=> loadFile(e.dataTransfer.files[0]));

function loadFile(f){
  if(!f || !f.type.startsWith('image/')) { toast('请选择图片文件'); return; }
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = ()=>{ state.img = img; enableExport(); render(); toast('底图已载入'); };
  img.src = url;
}

/* 示例底图：程序化生成 */
$('btnSample').onclick = ()=>{
  const c = document.createElement('canvas');
  c.width=1600; c.height=1000;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0,0,1600,1000);
  grad.addColorStop(0,'#1a2340'); grad.addColorStop(.5,'#3d2b52'); grad.addColorStop(1,'#0f1a2e');
  g.fillStyle=grad; g.fillRect(0,0,1600,1000);
  // 光斑
  for(let i=0;i<60;i++){
    const x=Math.random()*1600, y=Math.random()*1000, r=Math.random()*180+40;
    const rg=g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,`rgba(255,200,120,${Math.random()*.05})`);
    rg.addColorStop(1,'transparent');
    g.fillStyle=rg; g.fillRect(x-r,y-r,r*2,r*2);
  }
  // 地平线剪影
  g.fillStyle='#0a0d16';
  g.beginPath(); g.moveTo(0,1000);
  for(let x=0;x<=1600;x+=40) g.lineTo(x, 720 - Math.abs(Math.sin(x*.006))*160 - Math.random()*40);
  g.lineTo(1600,1000); g.closePath(); g.fill();
  const img = new Image();
  img.onload = ()=>{ state.img=img; enableExport(); render(); toast('已载入示例底图'); };
  img.src = c.toDataURL();
};

/* ================= 文案输入 ================= */
$('title').addEventListener('input', e=>{
  state.title = e.target.value;
  $('titleCount').textContent = [...state.title].length;
  render();
});
$('subtitle').addEventListener('input', e=>{ state.subtitle=e.target.value; render(); });
$('zoom').addEventListener('input', e=>{ state.zoom=+e.target.value; $('zoomVal').textContent=state.zoom.toFixed(2)+'×'; render(); });
$('dim').addEventListener('input', e=>{ state.dim=+e.target.value; $('dimVal').textContent=Math.round(state.dim*100)+'%'; render(); });
$('guides').addEventListener('change', e=>{ state.guides=e.target.checked; render(); });

function enableExport(){ $('btnOne').disabled=false; $('btnAll').disabled=false; }

/* ================= 渲染核心 ================= */

function getPan(key){ return state.pan[key] || {x:0,y:0}; }

function drawCover(canvas, R, p, {guides=false}={}){
  const w = R.w, h = R.h;
  canvas.width = w; canvas.height = h;
  const g = canvas.getContext('2d');
  const pan = getPan(R.key);

  g.fillStyle = '#101014';
  g.fillRect(0,0,w,h);

  /* --- 底图 cover-fit --- */
  if(state.img){
    const iw = state.img.naturalWidth, ih = state.img.naturalHeight;
    const base = Math.max(w/iw, h/ih);
    const s = base * state.zoom;
    const dw = iw*s, dh = ih*s;
    const slackX = Math.max(0,(dw-w)/2), slackY = Math.max(0,(dh-h)/2);
    g.drawImage(state.img, (w-dw)/2 + pan.x*slackX, (h-dh)/2 + pan.y*slackY, dw, dh);
  }

  /* --- 压暗 --- */
  if(state.dim>0){
    g.fillStyle = `rgba(10,10,16,${state.dim})`;
    g.fillRect(0,0,w,h);
  }

  /* --- 模板遮罩 --- */
  if(p.overlay==='bottom'){
    const gr = g.createLinearGradient(0, h*0.45, 0, h);
    gr.addColorStop(0,'rgba(8,8,14,0)');
    gr.addColorStop(1,'rgba(8,8,14,.62)');
    g.fillStyle=gr; g.fillRect(0,h*0.45,w,h*0.55);
  }else if(p.overlay==='v'){
    const top = g.createLinearGradient(0,0,0,h*0.4);
    top.addColorStop(0,'rgba(8,8,14,.55)'); top.addColorStop(1,'rgba(8,8,14,0)');
    g.fillStyle=top; g.fillRect(0,0,w,h*0.4);
    const bot = g.createLinearGradient(0,h*0.6,0,h);
    bot.addColorStop(0,'rgba(8,8,14,0)'); bot.addColorStop(1,'rgba(8,8,14,.7)');
    g.fillStyle=bot; g.fillRect(0,h*0.6,w,h*0.4);
  }

  /* --- 文字 --- */
  const title = state.title.trim() || '在这里输入标题';
  const sub = state.subtitle.trim();
  const pad = w * 0.062;
  const maxW = w - pad*2;
  const u = Math.min(w,h); // 相对单位

  let fs = Math.round(w * p.size);
  let lines, lineH;

  const layout = (size)=>{
    g.font = `${p.weight} ${size}px ${p.font}`;
    lineH = size * 1.18;
    lines = wrapText(g, title, maxW);
  };
  layout(fs);
  // 行数超限则缩小字号
  let guard = 0;
  while(lines.length > p.maxLines && fs > w*0.03 && guard++ < 40){
    fs = Math.round(fs*0.94);
    layout(fs);
  }
  const totalH = lines.length * lineH;
  // 实际文字块最大宽度（装饰元素定位用）
  let maxTextW = 0;
  lines.forEach(ln => maxTextW = Math.max(maxTextW, g.measureText(ln).width));

  // 位置锚点
  let x, y, align;
  const hasSub = !!sub;
  const subSpace = hasSub ? u*0.045 + u*0.032 : 0;
  if(p.pos==='bl'){ align='left'; x=pad; y=h-pad-subSpace; }
  else if(p.pos==='bc'){ align='center'; x=w/2; y=h-pad-subSpace; }
  else if(p.pos==='tl'){ align='left'; x=pad; y=pad+totalH; }
  else { align='center'; x=w/2; y=h/2+totalH/2; }

  g.textAlign = align;
  g.textBaseline = 'alphabetic';
  g.lineJoin = 'round';
  g.miterLimit = 2;

  // 每行绘制
  lines.forEach((ln,i)=>{
    const by = y - totalH + (i+1)*lineH - (lineH - fs)/2;
    if(p.shadow){
      g.shadowColor = p.shadow.color;
      g.shadowBlur = u * p.shadow.blur;
      g.shadowOffsetX = u * p.shadow.offX;
      g.shadowOffsetY = u * p.shadow.offY;
    }
    if(p.strokeRatio>0 && p.stroke){
      g.strokeStyle = p.stroke;
      g.lineWidth = fs * p.strokeRatio;
      g.strokeText(ln, x, by);
    }
    g.shadowColor = p.shadow ? p.shadow.color : 'transparent';
    g.shadowBlur = p.shadow ? u*p.shadow.blur : 0;
    g.fillStyle = p.color;
    g.fillText(ln, x, by);
    g.shadowColor='transparent'; g.shadowBlur=0; g.shadowOffsetX=0; g.shadowOffsetY=0;
  });

  /* --- 装饰 --- */
  const accentY = y - totalH - u*0.028;
  if(p.accentStyle==='bar' && lines.length){
    g.fillStyle = p.accent;
    g.fillRect(p.pos==='bl'? pad : x - u*0.03, accentY - u*0.012, u*0.06, u*0.012);
  }else if(p.accentStyle==='sides' && lines.length){
    const lw = u*0.05, gap = u*0.025;
    const left = align==='center' ? x - maxTextW/2 : pad;
    const right = align==='center' ? x + maxTextW/2 : pad + maxTextW;
    g.fillStyle = p.accent;
    g.fillRect(left - gap - lw, accentY - u*0.004, lw, u*0.008);
    g.fillRect(right + gap, accentY - u*0.004, lw, u*0.008);
  }else if(p.accentStyle==='underline' && lines.length){
    g.strokeStyle = p.accent; g.lineWidth = Math.max(2,u*0.006); g.lineCap='round';
    const ux = align==='left' ? pad : x - maxTextW/2;
    g.beginPath();
    g.moveTo(ux, y + u*0.012);
    g.lineTo(ux + u*0.14, y + u*0.012);
    g.stroke();
  }else if(p.accentStyle==='rule' && lines.length){
    g.fillStyle = 'rgba(255,255,255,.9)';
    const rx = align==='left' ? pad - u*0.028 : x - maxTextW/2 - u*0.028;
    g.fillRect(rx, accentY - u*0.006, u*0.007, totalH + (hasSub?subSpace:0));
  }

  /* --- 副标题 --- */
  if(hasSub){
    const sfs = Math.round(u*0.032);
    g.font = `700 ${sfs}px "Noto Sans SC"`;
    const sy = y + u*0.045;
    if(p.subBg){
      const tw = g.measureText(sub).width;
      const bx = align==='left' ? pad : x - tw/2;
      const bxPad = u*0.012, byPad = u*0.008;
      g.fillStyle = p.subBg;
      roundRect(g, bx - bxPad, sy - sfs - byPad + u*0.004, tw + bxPad*2, sfs + byPad*2, u*0.006);
      g.fill();
    }
    g.fillStyle = p.subColor;
    g.textAlign = align;
    g.fillText(sub, align==='left'? pad : x, sy);
  }

  /* --- 安全区参考线（仅预览） --- */
  if(guides){
    g.strokeStyle='rgba(255,80,80,.55)';
    g.setLineDash([8,8]); g.lineWidth=Math.max(1,u*0.002);
    g.strokeRect(w*0.05, h*0.05, w*0.9, h*0.9);
    g.setLineDash([]);
    g.strokeStyle='rgba(255,80,80,.3)';
    g.beginPath(); g.moveTo(w/2,0); g.lineTo(w/2,h); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();
    g.fillStyle='rgba(255,80,80,.8)';
    g.font=`${Math.round(u*0.016)}px "JetBrains Mono"`;
    g.textAlign='left';
    g.fillText('SAFE AREA 90%', w*0.05+8, h*0.05+20);
  }
}

function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

function wrapText(g, text, maxW){
  const chars = [...text];
  const lines = []; let cur = '';
  for(const ch of chars){
    const test = cur + ch;
    if(g.measureText(test).width > maxW && cur){
      lines.push(cur); cur = ch;
    }else cur = test;
  }
  if(cur) lines.push(cur);
  return lines;
}

function render(){
  const R = RATIOS[state.ratio];
  const p = PRESETS[state.preset];
  drawCover(preview, R, p, {guides:state.guides});
}

/* ================= 预览拖动构图 ================= */
let dragging=false, dragStart=null;
preview.addEventListener('pointerdown', e=>{
  if(!state.img) return;
  dragging=true; preview.classList.add('grabbing');
  dragStart={x:e.clientX, y:e.clientY};
  preview.setPointerCapture(e.pointerId);
});
preview.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const R = RATIOS[state.ratio];
  const rect = preview.getBoundingClientRect();
  const sx = (dragStart.x - rect.left)/rect.width - .5;
  const sy = (dragStart.y - rect.top)/rect.height - .5;
  const nx = (e.clientX - rect.left)/rect.width - .5;
  const ny = (e.clientY - rect.top)/rect.height - .5;
  const pan = getPan(R.key);
  state.pan[R.key] = {
    x: clamp(pan.x - (nx-sx)/state.zoom, -1, 1),
    y: clamp(pan.y - (ny-sy)/state.zoom, -1, 1),
  };
  dragStart={x:e.clientX,y:e.clientY};
  render();
});
['pointerup','pointercancel'].forEach(ev=>preview.addEventListener(ev,()=>{
  dragging=false; preview.classList.remove('grabbing');
}));
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ================= 导出 ================= */
function slug(){
  const t = (state.title.trim()||'cover').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,20);
  return t;
}
function exportOne(i){
  const R = RATIOS[i];
  const c = document.createElement('canvas');
  drawCover(c, R, PRESETS[state.preset]);
  const a = document.createElement('a');
  a.download = `${slug()}_${R.key}_${R.w}x${R.h}.png`;
  a.href = c.toDataURL('image/png');
  a.click();
}

$('btnOne').onclick = ()=>{
  exportOne(state.ratio);
  toast(`已导出 ${RATIOS[state.ratio].label} PNG`);
};
$('btnAll').onclick = async ()=>{
  for(let i=0;i<RATIOS.length;i++){
    exportOne(i);
    toast(`导出 ${RATIOS[i].label} …`);
    await new Promise(r=>setTimeout(r,350));
  }
  toast('✓ 全部尺寸导出完成');
};

/* ================= Toast ================= */
function toast(msg){
  const el = document.createElement('div');
  el.className='toast-item';
  el.textContent = msg;
  $('toast').appendChild(el);
  setTimeout(()=>{ el.style.transition='.3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2200);
}

/* ================= 字体就绪后首渲染 ================= */
Promise.all([
  document.fonts.load('900 20px "Noto Sans SC"'),
  document.fonts.load('400 20px "ZCOOL QingKe HuangYou"'),
  document.fonts.load('400 20px "Ma Shan Zheng"'),
  document.fonts.load('900 20px "Noto Serif SC"'),
  document.fonts.load('700 20px "JetBrains Mono"'),
]).then(render).catch(render);
render();
</script>
